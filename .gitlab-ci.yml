image: node:latest

stages:
  - deploy

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_NAME =~ /^v\d+\.\d+\.\d+.*$/
      changes:
        - package.json
  script:
    - echo "registry=https://registry.npmjs.org/:_authToken=:_authToken=${CI_JOB_TOKEN}">.npmrc
    - npm ci
    - npm publish